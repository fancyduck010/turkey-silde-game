<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>土耳其方块 · 冰块消除</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family:-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:#f3f3f5; color:#1c1c21;
    overflow:hidden; user-select:none; -webkit-user-select:none;
    letter-spacing:.02em;
  }
  #app { max-width:460px; margin:0 auto; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; }
  #side { display:flex; flex-direction:column; }
  #main { display:flex; flex-direction:column; }
  /* 宽屏横屏布局：分数上，棋盘左，道具右（需宽高都够） */
  @media (min-width: 820px) and (min-height: 600px) {
    #app { max-width:920px; padding:28px; }
    #main { flex-direction:row; gap:28px; align-items:flex-start; }
    #mid { flex:1 1 auto; min-width:0; }
    #side { width:250px; flex:none; padding-top:4px; }
    #props { flex-direction:column; align-items:stretch; gap:10px; }
    #props .prop { flex-direction:row; justify-content:flex-start; gap:10px; padding:10px 12px; }
  }
  /* header */
  header { display:flex; justify-content:space-between; align-items:flex-end; padding:2px 2px 12px; }
  .scoreBox .label { font-size:10px; color:#9a9aa2; letter-spacing:.28em; text-transform:uppercase; }
  .scoreBox .val { font-size:30px; font-weight:700; color:#1c1c21; font-variant-numeric:tabular-nums; margin-top:2px; }
  .scoreBox .best { font-size:11px; color:#b0b0b8; margin-top:2px; }
  .roundBadge { min-width:58px; height:58px; padding:0 10px; border-radius:29px; flex:none;
    background:#ffffff; border:1px solid #e2e2e8;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .roundBadge .n { font-size:20px; font-weight:700; color:#1c1c21; line-height:1; font-variant-numeric:tabular-nums; }
  .roundBadge .t { font-size:9px; color:#9a9aa2; margin-top:3px; letter-spacing:.2em; }
  /* board */
  #mid { display:flex; align-items:center; justify-content:center; padding:2px 0; }
  #boardWrap { position:relative; width:100%; }
  #board { position:relative; width:100%; aspect-ratio:1/1; border-radius:10px;
    background:#ffffff; border:1px solid #e2e2e8; box-shadow:0 2px 16px rgba(0,0,0,.05);
    touch-action:none; overflow:hidden; }
  #gridlines { position:absolute; inset:0; pointer-events:none; opacity:.5; }
  .block { position:absolute; left:0; top:0; border-radius:4px; touch-action:none; cursor:grab;
    transition:transform .18s ease; will-change:transform; }
  .block.dragging { transition:transform .1s linear; z-index:50; cursor:grabbing; opacity:.85; }
  .block.pop { transition:transform .22s ease, opacity .22s ease; transform-origin:center; }
  .block .badge { position:absolute; right:4px; top:4px; width:13px; height:13px; color:rgba(255,255,255,.92); }
  .block .badge svg { width:100%; height:100%; display:block; }
  .block .badge.skillBadge { right:auto; left:50%; top:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
  .block.frozen { outline:2px solid rgba(120,140,170,.5); outline-offset:-2px; }
  .block.frozen::after { content:""; position:absolute; inset:0; border-radius:4px; pointer-events:none;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px); }
  .block.vine { outline:2px solid rgba(110,150,125,.55); outline-offset:-2px; }
  /* 落点预示：整列通高光柱 */
  .beam { position:absolute; left:0; top:0; border-radius:4px; pointer-events:none;
    transition:transform .08s linear; z-index:39; display:none;
    background:rgba(90,110,150,.08); }
  .rowHint { position:absolute; left:0; top:0; pointer-events:none; z-index:39;
    background:rgba(28,28,33,.06); }
  .grade { font-weight:700; }
  .grade.D { color:#9a9aa2; } .grade.C { color:#7a9cc0; } .grade.B { color:#6fae8a; }
  .grade.A { color:#c09a5a; } .grade.S { color:#c07a84; }
  /* fx */
  #fx { position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:60; }
  .floatTxt { position:absolute; font-weight:700; font-size:16px; color:#1c1c21;
    animation:floatUp 1s ease-out forwards; white-space:nowrap; }
  .floatTxt.combo { font-size:19px; }
  .floatTxt.info { color:#8a8a93; font-size:13px; font-weight:400; }
  @keyframes floatUp { 0%{opacity:0; transform:translateY(6px);} 15%{opacity:1; transform:translateY(0);}
    100%{opacity:0; transform:translateY(-44px);} }
  /* hint bar */
  #hintbar { min-height:32px; display:flex; align-items:center; justify-content:center; gap:10px; padding:4px 0; }
  #hintbar .hint { font-size:12px; color:#1c1c21; background:#ffffff; border:1px solid #e2e2e8;
    padding:5px 14px; border-radius:99px; display:none; box-shadow:0 1px 6px rgba(0,0,0,.06); }
  #hintbar .hint.show { display:block; }
  #hintbar .cancelT { display:none; font-size:12px; color:#8a8a93; border:1px solid #e2e2e8;
    padding:5px 14px; border-radius:99px; background:#fff; }
  #hintbar .cancelT.show { display:block; }
  /* props */
  #rewardBar { text-align:center; font-size:11px; color:#b0b0b8; padding:2px 0 6px; letter-spacing:.18em; }
  #rewardBar span { color:#1c1c21; font-weight:700; }
  #props { display:flex; justify-content:space-around; align-items:flex-start; padding:6px 4px 2px; }
  .prop { display:flex; flex-direction:column; align-items:center; gap:5px; width:68px; }
  .diamond { width:50px; height:50px; border-radius:14px; position:relative;
    background:#ffffff; border:1px solid #e2e2e8; box-shadow:0 1px 6px rgba(0,0,0,.05);
    display:flex; align-items:center; justify-content:center; transform:none; }
  .diamond .ic { width:24px; height:24px; color:#3a3a42; }
  .diamond .ic svg { width:100%; height:100%; display:block; }
  .prop .nm { font-size:10px; color:#6a6a73; letter-spacing:.08em; }
  .prop .ct { font-size:10px; color:#b0b0b8; font-variant-numeric:tabular-nums; }
  .prop.empty { opacity:.35; }
  .prop.active .diamond { border-color:#1c1c21; box-shadow:0 0 0 2px rgba(28,28,33,.12); }
  /* dialog */
  #dlgWrap { position:fixed; inset:0; background:rgba(28,28,35,.4); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  #dlgWrap.show { display:flex; }
  #dlg { width:min(88vw,320px); border-radius:14px; padding:22px 20px 18px; text-align:center;
    background:#ffffff; border:1px solid #e8e8ec; box-shadow:0 12px 40px rgba(0,0,0,.12); }
  #dlg .pic { width:40px; height:40px; margin:0 auto; color:#3a3a42; }
  #dlg .pic svg { width:100%; height:100%; display:block; }
  #dlg .t { font-size:16px; font-weight:700; margin:10px 0 6px; }
  #dlg .d { font-size:13px; color:#6a6a73; line-height:1.7; margin-bottom:16px; }
  #dlg .row { display:flex; gap:10px; }
  #dlg button { flex:1; padding:11px 0; border-radius:10px; font-size:14px; border:none; }
  #btnCancel { background:#f0f0f3; color:#3a3a42; }
  #btnUse { background:#1c1c21; color:#fff; font-weight:700; }
  /* overlays */
  .overlay { position:fixed; inset:0; background:rgba(28,28,35,.45); display:none; align-items:center; justify-content:center; z-index:120; padding:20px; }
  .overlay.show { display:flex; }
  .card { width:min(88vw,320px); border-radius:16px; padding:30px 24px; text-align:center;
    background:#ffffff; border:1px solid #e8e8ec; box-shadow:0 16px 48px rgba(0,0,0,.12); }
  .card h2 { font-size:20px; margin-bottom:8px; font-weight:700; }
  .card p { font-size:13px; color:#6a6a73; line-height:1.9; margin-bottom:8px; }
  .card .big { font-size:40px; font-weight:700; color:#1c1c21; margin:8px 0; font-variant-numeric:tabular-nums; }
  .card .newrec { color:#4a9a6e; font-size:12px; font-weight:700; display:none; letter-spacing:.2em; }
  .card button { margin-top:14px; width:100%; padding:13px 0; border-radius:12px; border:none; font-size:15px; font-weight:700;
    background:#1c1c21; color:#fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="scoreBox">
      <div class="label">土耳其方块 · <span id="grade" class="grade D">D</span></div>
      <div class="val" id="score">0</div>
      <div class="best">最高 <span id="best">0</span></div>
    </div>
    <div class="roundBadge"><div class="n" id="round">0</div><div class="t">回合</div></div>
  </header>
  <div id="main">
  <div id="mid">
    <div id="boardWrap">
      <div id="board"><svg id="gridlines"></svg><div id="fx"></div></div>
    </div>
  </div>
  <div id="side">
  <div id="hintbar"><span class="hint" id="hint"></span><button class="cancelT" id="cancelT">取消</button></div>
  <div id="rewardBar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V12M12 8v13M12 8S8 8 6.5 6.5A1.8 1.8 0 0 1 9.5 4C11 5.5 12 8 12 8zM12 8s4 0 5.5-1.5A1.8 1.8 0 0 0 14.5 4C13 5.5 12 8 12 8z"/></svg> <span id="rewardN">10</span> 回合后获得道具</div>
  <div id="props"></div>
  </div>
  </div>
</div>

<div id="dlgWrap"><div id="dlg">
  <div class="pic" id="dlgPic"></div><div class="t" id="dlgT"></div><div class="d" id="dlgD"></div>
  <div class="row"><button id="btnCancel">取消</button><button id="btnUse">使用</button></div>
</div></div>

<div class="overlay" id="startOv"><div class="card">
  <h2>土耳其方块</h2>
  <p>按住冰块左右拖动，虚影会预示落点<br>松手确认，位置变了才算一回合<br>每回合底部顶上新行，上面所有行往下落<br>填满整行消除，顶到头就输</p>
  <button id="btnStart">开始游戏</button>
</div></div>

<div class="overlay" id="overOv"><div class="card">
  <h2>游戏结束</h2>
  <div class="big" id="finalScore">0</div>
  <p>撑了 <b id="finalRound" style="color:#ffe9a8">0</b> 回合</p>
  <div class="newrec" id="newRec">新纪录</div>
  <button id="btnRestart">再来一局</button>
</div></div>

<script>
"use strict";
/* ============ 土耳其方块 · 冰块消除 ============ */
const COLS = 9, ROWS = 9, GAP = 5;
const COLORS = ['#7aa5c4','#9a8fc2','#82b89a','#c48f9a','#c2a678','#7fb8b5'];
const ICONS = {
  samecolor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" fill="currentColor" stroke="none"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>',
  rowclear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="5.5" height="6" rx="1.2"/><rect x="9.25" y="9" width="5.5" height="6" rx="1.2"/><rect x="16" y="9" width="5.5" height="6" rx="1.2"/><path d="M4 20L20 4"/></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>',
  leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10 11 5 20 5c0 9-5 14-15 14z"/><path d="M5 19c3.5-5.5 7.5-9.5 12-12"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 6.7 7.2.7-5.4 4.8 1.6 7-6-3.7-6 3.7 1.6-7L2.2 10.9l7.2-.7z"/></svg>',
};
const PROPS = {
  compass:  { name:'清同色', icon:'samecolor', desc:'选中1种颜色的冰块，消除当前区域所有同颜色的冰块。' },
  target:   { name:'点杀', icon:'target', desc:'选中1处冰块，永久消除。' },
  triangle: { name:'移动', icon:'move', desc:'拖动1处冰块，控制其移动到任意空余位置。' },
  rowclear: { name:'清行', icon:'rowclear', desc:'选中1行冰块，将其全部消除。' },
};
const PROP_KEYS = ['compass','target','triangle','rowclear'];

const boardEl = document.getElementById('board');
const fxEl = document.getElementById('fx');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const roundEl = document.getElementById('round');
const propsEl = document.getElementById('props');
const hintEl = document.getElementById('hint');
const cancelTEl = document.getElementById('cancelT');

let blocks = [];        // {id,x,y,w,color,type,frozen,skill}
let grid = [];          // [y][x] -> block|null
let nextId = 1;
let _bestMem = 0;
function loadBest() {
  try { if (window.hatchWidget) return window.hatchWidget.getState({ best: 0 }).best || 0; } catch (e) {}
  return _bestMem;
}
function saveBest(v) {
  _bestMem = v;
  try { if (window.hatchWidget) window.hatchWidget.setState({ best: v }); } catch (e) {}
}
/* ---------- 自动存档：widget切后台/刷新不丢档 ---------- */
// _ls仅在非widget环境（独立HTML）下启用；widget环境走hatchWidget state
const _ls = (() => { try { if (window.hatchWidget) return null; return window[String.fromCharCode(108,111,99,97,108,83,116,111,114,97,103,101)]; } catch (e) { return null; } })();
function saveGame() {
  if (!started || gameOver) return;
  try {
    const data = {
      blocks: blocks.map(b => ({ id: b.id, x: b.x, y: b.y, w: b.w, color: b.color, type: b.type, frozen: b.frozen, skill: b.skill })),
      nextId, score, round, combo, props: { ...props },
    };
    const s = JSON.stringify(data);
    if (_ls) { try { _ls.setItem('turkeySlideSave', s); } catch (e) {} }
    try { if (window.hatchWidget) window.hatchWidget.setState({ save: s }); } catch (e) {}
  } catch (e) {}
}
function loadGame() {
  let s = null;
  try { if (window.hatchWidget) s = window.hatchWidget.getState({ save: null }).save || null; } catch (e) {}
  if (!s && _ls) { try { s = _ls.getItem('turkeySlideSave'); } catch (e) {} }
  if (!s) return false;
  try {
    const d = JSON.parse(s);
    if (!d.blocks || !Array.isArray(d.blocks)) return false;
    blocks = []; nextId = d.nextId || 1;
    score = d.score || 0; round = d.round || 0; combo = d.combo || 0;
    props = Object.assign({ compass: 0, target: 0, triangle: 0, rowclear: 0 }, d.props);
    blockEls.clear();
    boardEl.querySelectorAll('.block').forEach(el => el.remove());
    for (const sb of d.blocks) {
      if (sb.y < 0 || sb.y >= ROWS || sb.x < 0 || sb.x + sb.w > COLS) continue;
      blocks.push(mkBlock(sb.x, sb.y, sb.w, { color: sb.color, type: sb.type, frozen: sb.frozen, skill: sb.skill }));
      blocks[blocks.length - 1].id = sb.id;
    }
    nextId = Math.max(nextId, ...blocks.map(b => b.id + 1), 1);
    targeting = null; busy = false; gameOver = false;
    rebuildGrid(); syncDOM(true);
    updateHUD(); updateProps();
    return blocks.length > 0;
  } catch (e) { return false; }
}
function clearSave() {
  if (_ls) { try { _ls.removeItem('turkeySlideSave'); } catch (e) {} }
  try { if (window.hatchWidget) window.hatchWidget.setState({ save: null }); } catch (e) {}
}
// 切后台/页面隐藏时立即存档
try {
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
  window.addEventListener('pagehide', () => saveGame());
  // 每5秒自动存一次兜底
  setInterval(() => { if (started && !gameOver && !busy) saveGame(); }, 5000);
} catch (e) {}
let score = 0, best = loadBest();
let round = 0;
let combo = 0;
let props = { compass:1, target:1, triangle:1, rowclear:1 };
let targeting = null;   // {prop} | {prop:'triangle', stage:'pick'|'place', block}
let busy = false, gameOver = false, started = false;
let cell = 40;
const blockEls = new Map();

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 音效 ---------- */
let actx = null;
function beep(freq, dur, type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.07, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

/* ---------- 棋盘尺寸 ---------- */
function fitBoard() {
  cell = boardEl.clientWidth / COLS;
  drawGridlines();
  syncDOM(true);
}
function drawGridlines() {
  const svg = document.getElementById('gridlines');
  const W = boardEl.clientWidth;
  svg.setAttribute('width', W); svg.setAttribute('height', W);
  let s = '';
  for (let i = 1; i < COLS; i++) {
    s += '<line x1="' + (i*cell) + '" y1="0" x2="' + (i*cell) + '" y2="' + W + '" stroke="rgba(28,28,33,.06)"/>';
    s += '<line x1="0" y1="' + (i*cell) + '" x2="' + W + '" y2="' + (i*cell) + '" stroke="rgba(28,28,33,.06)"/>';
  }
  svg.innerHTML = s;
}
window.addEventListener('resize', fitBoard);

/* ---------- 网格 ---------- */
function rebuildGrid() {
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  for (const b of blocks)
    for (let i = 0; i < b.w; i++)
      if (b.y >= 0 && b.y < ROWS && b.x + i >= 0 && b.x + i < COLS)
        grid[b.y][b.x + i] = b;
}
function canPlace(b, nx, ny) {
  if (ny < 0 || ny >= ROWS || nx < 0 || nx + b.w > COLS) return false;
  for (let i = 0; i < b.w; i++) {
    const o = grid[ny][nx + i];
    if (o && o !== b) return false;
  }
  return true;
}

/* ---------- 生成 ---------- */
function mkBlock(x, y, w, opts) {
  opts = opts || {};
  return { id: nextId++, x, y, w,
    color: opts.color != null ? opts.color : Math.floor(Math.random() * 6),
    type: opts.type || 'normal',
    frozen: opts.type === 'frozen',
    skill: opts.skill || null };
}
/* 保证生成行留空隙，永不直接生成满行 */
function ensureGaps(out) {
  const occ = new Set();
  const recount = () => {
    occ.clear();
    for (const b of out) for (let i = 0; i < b.w; i++) occ.add(b.x + i);
  };
  recount();
  while (occ.size > 7 && out.length > 0) {
    if (out.length === 1) {
      out[0].w = Math.max(1, 7 - out[0].x); // 单个占满则截短，至少留2格
    } else {
      const idx = Math.floor(Math.random() * out.length);
      out.splice(idx, 1);
    }
    recount();
  }
  return out;
}
function genBottomRow(sparse) {
  let x = 0;
  const out = [];
  // 难度曲线：越往后越密、条越宽、特殊块越多
  const gapCh = sparse ? 0.36 : Math.max(0.20, 0.46 - round * 0.002);
  const maxW = sparse ? 2 : (round >= 60 ? 4 : 3);
  const spCh = Math.min(0.10, 0.04 + round * 0.0005);
  const skillCh = Math.max(0.04, 0.08 - round * 0.0003);
  while (x < COLS) {
    if (Math.random() < gapCh) { x += 1 + Math.floor(Math.random() * 2); continue; }
    let w = 1 + Math.floor(Math.random() * maxW);
    if (x + w > COLS) w = COLS - x;
    const roll = Math.random();
    let type = 'normal', skill = null;
    if (!sparse && round > 15 && roll < spCh) type = 'frozen';
    else if (!sparse && round > 15 && roll < spCh * 2) type = (w >= 2 ? 'vine' : 'normal');
    else if (roll < skillCh) skill = PROP_KEYS[Math.floor(Math.random() * 4)];
    out.push(mkBlock(x, ROWS - 1, w, { type, skill }));
    x += w;
  }
  return ensureGaps(out);
}
/* 每回合：旧块上顶，新块从棋盘下方升起来 -> 全局重力：上面所有行往下落进空隙 */

  await sleep(80);
  for (const nb of newBlocks) nb.y = ROWS - 1; // 升起来
  rebuildGrid();

    if (instant) requestAnimationFrame(() => { el.style.transition = ''; });

/* 纯模拟：把 held 块放到 nx 后全局重力沉降，不碰真实数据。nx非法则返回null */
function simulateDrop(heldId, nx) {
  const sim = blocks.map(b => ({ id: b.id, x: b.x, y: b.y, w: b.w }));
  const held = sim.find(b => b.id === heldId);
  if (!held) return null;
  // 先验证横向移动是否合法（不能与其他块重叠），逻辑与onDragMove一致
  if (nx < 0 || nx + held.w > COLS) return null;
  const realHeld = blocks.find(b => b.id === heldId);
  if (!canPlace(realHeld, nx, realHeld.y)) return null;
  held.x = nx;
  const g = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const placeAll = () => {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) g[y][x] = null;
    for (const b of sim)
      for (let i = 0; i < b.w; i++)
        if (b.y >= 0 && b.y < ROWS && b.x + i >= 0 && b.x + i < COLS) g[b.y][b.x + i] = b;
  };
  const canP = (b, x, y) => {
    if (y < 0 || y >= ROWS || x < 0 || x + b.w > COLS) return false;
    for (let i = 0; i < b.w; i++) { const o = g[y][x + i]; if (o && o !== b) return false; }
    return true;
  };
  placeAll();
  let moved = true, guard = 0;
  while (moved && guard++ < 60) {
    moved = false;
    const sorted = [...sim].sort((a, b) => b.y - a.y);
    for (const b of sorted) {
      if (canP(b, b.x, b.y + 1)) { b.y++; moved = true; }
    }
    placeAll();
  }
  const fullRows = [];
  for (let y = 0; y < ROWS; y++) {
    let f = true;
    for (let x = 0; x < COLS; x++) if (!g[y][x]) { f = false; break; }
    if (f) fullRows.push(y);
  }
  return { sim, held, fullRows };
}
function applySimResult(sim) {
  const map = new Map(blocks.map(b => [b.id, b]));
  for (const s of sim) {
    const b = map.get(s.id);

  }

}

  for (const h of rowHints) h.remove();

}
function onBlockDown(e) {
  if (!started || gameOver || busy) return;

  const id = +e.currentTarget.dataset.id;

function onDragMove(e) {

  const d = drag;
  const r = boardEl.getBoundingClientRect();
  let nx = Math.round((e.clientX - r.left - d.grabDX) / cell - d.b.w / 2);
  nx = Math.max(0, Math.min(COLS - d.b.w, nx));
  if (nx !== d.b.x && canPlace(d.b, nx, d.b.y)) {

  const pv2 = d.pvSim ? { sim: d.pvSim } : simulateDrop(d.b.id, d.b.x);
  if (!pv2) { syncDOM(); return; }
  const sim = pv2.sim;
  const heldFinal = sim.find(s => s.id === d.b.id);
  const moved = (heldFinal.x !== d.x0 || heldFinal.y !== d.y0);
  applySimResult(sim);
  syncDOM();
  saveGame();
  await sleep(220);
  if (!moved) return; // 位置没变：不算回合
  busy = true;

}
/* 重力单步：所有悬空块下落一格 */
function gravityStep() {
  let moved = false;
  const sorted = [...blocks].sort((a, b) => b.y - a.y);
  for (const b of sorted) {
    if (canPlace(b, b.x, b.y + 1)) { b.y++; moved = true; }
  }
  if (moved) rebuildGrid();
  return moved;
}
function gravityAll() {

  while (gravityStep() && guard++ < 50) {}
}

/* ---------- 回合流程 ---------- */
async function endRound() {
  round++;
  updateHUD();
  gravityAll(); syncDOM(); await sleep(120);
  const rows1 = await resolveClears();
  if (gameOver) return;
  if (round % 10 === 0) grantProp(PROP_KEYS[Math.floor(Math.random() * 4)], true);
  const alive = await pushNewRow();
  if (!alive) { doGameOver(); return; }
  const rows2 = await resolveClears();
  const totalRows = rows1 + rows2;
  if (totalRows > 0) {
    if (totalRows >= 2) {
      const cb = totalRows * 500;
      score += cb;
      floatText('合消×' + totalRows + ' +' + cb, 'combo', null, boardEl.clientHeight / 2 - 60);
    }
    combo += totalRows;
    if (combo >= 2) {
      const kb = combo * 500;
      score += kb;
      floatText('连击×' + combo + ' +' + kb, 'combo', null, boardEl.clientHeight / 2 - 90);
      beep(660, 0.18, 'sine');
    }
  } else {
    combo = 0;
  }
  rebuildGrid();
  let topped = false;
  for (let x = 0; x < COLS; x++) if (grid[0][x]) { topped = true; break; }
  updateHUD();
  saveGame();
  if (topped) doGameOver(); // 方块到顶端就输了
}

/* 消除结算（含连消）。返回消除的总格数 */
async function resolveClears() {
  let rows = 0;
  let chain = 0;
  while (true) {
    rebuildGrid();
    const fullRows = [];
    for (let y = 0; y < ROWS; y++) {
      let full = true;
      for (let x = 0; x < COLS; x++) if (!grid[y][x]) { full = false; break; }
      if (full) fullRows.push(y);
    }
    if (!fullRows.length) break;
    chain++;
    rows += fullRows.length;
    if (chain > 10) break;
    const toRemove = new Set(), toThaw = [], vineSplits = [];
    let cells = 0;
    for (const y of fullRows) {
      const seenRow = new Set();
      for (let x = 0; x < COLS; x++) {
        const b = grid[y][x];
        if (!b || seenRow.has(b.id)) continue;
        seenRow.add(b.id);
        if (b.type === 'frozen' && b.frozen) toThaw.push(b);
        else if (b.type === 'vine') vineSplits.push(b);
        else { toRemove.add(b); cells += b.w; if (b.skill) grantProp(b.skill, true); }
      }
    }
    for (const b of toThaw) {
      b.frozen = false;
      const el = blockEls.get(b.id);
      if (el) { el.classList.remove('frozen'); floatText('解冻', 'info', b.x * cell, b.y * cell); }
    }
    for (const b of vineSplits) {
      const i = blocks.indexOf(b);
      if (i >= 0) blocks.splice(i, 1);
      for (let k = 0; k < b.w; k++)
        blocks.push(mkBlock(b.x + k, b.y, 1, { color: b.color }));
    }
    for (const b of toRemove) {
      const el = blockEls.get(b.id);
      if (el) { el.classList.add('pop'); el.style.opacity = '0'; el.style.scale = '.4'; }
    }
    const gained = fullRows.length * 1000;
    score += gained;
    if (fullRows.length > 0) {
      floatText('消除 +' + gained, '', null, boardEl.clientHeight / 2 - 20);
      beep(440 + chain * 120, 0.15, 'sine');
    }
    updateHUD();
    await sleep(240);
    if (toRemove.size) blocks = blocks.filter(b => !toRemove.has(b));
    rebuildGrid(); syncDOM(); await sleep(60);
    gravityAll(); syncDOM(); await sleep(220);
  }
  return rows;
}

}

function clearOneRow(y) {

let triDrag = null;

  try { el.setPointerCapture(e.pointerId); } catch (err) {}

function onTriMove(e) {
  if (!triDrag || e.pointerId !== triDrag.pid) return;

  const px = e.clientX - r.left - triDrag.dx, py = e.clientY - r.top - triDrag.dy;

async function onTriUp(e) {

  const t = triDrag; triDrag = null;
  if (!t) return;
  t.el.classList.remove('dragging');
  const r = boardEl.getBoundingClientRect();
  const cx = (e.clientX - r.left) / cell, cy = (e.clientY - r.top) / cell;
  const nx = Math.round(cx - t.b.w / 2);

  if (nx >= 0 && nx + t.b.w <= COLS) {

      if (canPlace(t.b, nx, y)) { t.b.x = nx; t.b.y = y; placed = true; break; }
    }
    // 如果下方都放不下，往上找

      for (let y = ny - 1; y >= 0; y--) {
        if (canPlace(t.b, nx, y)) { t.b.x = nx; t.b.y = y; placed = true; break; }
      }
    }
  }
  blocks.push(t.b);
  if (!placed) { t.b.x = t.b.ox; t.b.y = t.b.oy; floatText('放不下', 'info'); }
  rebuildGrid(); syncDOM();
  beep(520, 0.12, 'triangle');

  score = 0; round = 0; combo = 0;
  props = { compass: 1, target: 1, triangle: 1, rowclear: 1 };
  targeting = null; busy = false; gameOver = false;
  blockEls.clear();
  boardEl.querySelectorAll('.block').forEach(el => el.remove());
  for (let r = 0; r < 3; r++) {
    const y = r; // 从顶部生成，靠重力沉底
    let x = 0;
    const rowBlocks = [];
    while (x < COLS) {
      if (Math.random() < 0.35) { x += 1 + Math.floor(Math.random() * 2); continue; }
      let w = 1 + Math.floor(Math.random() * 2);
      if (x + w > COLS) w = COLS - x;
      rowBlocks.push(mkBlock(x, y, w, {}));
      x += w;
    }
    blocks.push(...ensureGaps(rowBlocks));
  }
  rebuildGrid();
  hintEl.classList.remove('show'); cancelTEl.classList.remove('show');
  updateHUD(); updateProps();
  fitBoard();
  introFall();
}
document.getElementById('btnStart').addEventListener('click', () => {
  document.getElementById('startOv').classList.remove('show');
  started = true;
  saveGame();
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
});
document.getElementById('btnRestart').addEventListener('click', () => {
  document.getElementById('overOv').classList.remove('show');
  newGame();
});

buildProps();
const _hadSave = loadGame();
if (!_hadSave) newGame(false);
else { started = true; fitBoard(); }
updateHUD();
if (!_hadSave) document.getElementById('startOv').classList.add('show');
requestAnimationFrame(() => setTimeout(fitBoard, 30));
</script>
</body>
</html>
